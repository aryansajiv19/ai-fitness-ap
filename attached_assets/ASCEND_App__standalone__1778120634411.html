document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --bg: #000;\n    --bg-2: #050505;\n    --fg: #f5f5f0;\n    --fg-dim: #6a6a66;\n    --fg-faint: #2e2e2c;\n    --rule: #161614;\n    --rule-strong: #232321;\n    --accent: #ff6500;\n    --accent-glow: rgba(255,101,0,0.5);\n    --red: #ef4444;\n    --amber: #facc15;\n    --serif: \"DM Sans\", -apple-system, sans-serif;\n    --sans: \"DM Sans\", -apple-system, sans-serif;\n    --mono: \"JetBrains Mono\", \"SF Mono\", Menlo, monospace;\n  }\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n  html, body {\n    background: var(--bg); color: var(--fg);\n    font-family: var(--sans);\n    font-weight: 400;\n    -webkit-font-smoothing: antialiased;\n    overflow-x: hidden;\n  }\n  body { min-height: 100vh; position: relative; }\n\n  /* Ambient glow */\n  .ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }\n  .ambient .glow {\n    position: absolute; border-radius: 50%;\n    filter: blur(120px); opacity: 0.12;\n    mix-blend-mode: screen;\n  }\n  .ambient .g1 { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -100px; animation: drift1 24s ease-in-out infinite; }\n  .ambient .g2 { width: 400px; height: 400px; background: #ff3300; bottom: -100px; right: -80px; animation: drift2 28s ease-in-out infinite; }\n  @keyframes drift1 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(30vw,40vh) scale(1.15);} }\n  @keyframes drift2 { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-25vw,-30vh) scale(1.2);} }\n\n  .grain { position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: 0.05; mix-blend-mode: overlay; }\n  .grain svg { width: 100%; height: 100%; }\n\n  .cursor-glow {\n    position: fixed; width: 320px; height: 320px;\n    border-radius: 50%; pointer-events: none; z-index: 2;\n    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);\n    opacity: 0.06; transform: translate(-50%, -50%); mix-blend-mode: screen;\n  }\n\n  /* ============ APP SHELL ============ */\n  .app { display: flex; min-height: 100vh; position: relative; z-index: 10; }\n\n  /* Sidebar */\n  aside.nav {\n    width: 220px; flex-shrink: 0;\n    border-right: 1px solid var(--rule);\n    padding: 32px 24px;\n    display: flex; flex-direction: column;\n    position: sticky; top: 0; height: 100vh;\n    background: rgba(0,0,0,0.6);\n    backdrop-filter: blur(8px);\n  }\n  .nav-mark {\n    font-family: var(--sans); font-size: 26px; font-weight: 700;\n    letter-spacing: -0.025em; line-height: 1;\n    margin-bottom: 48px;\n    display: flex;\n  }\n  .nav-mark .ch {\n    display: inline-block;\n    animation: charDrop 0.7s cubic-bezier(.2,.7,.2,1) both;\n  }\n  .nav-mark .ch:nth-child(1){animation-delay:.05s}\n  .nav-mark .ch:nth-child(2){animation-delay:.10s}\n  .nav-mark .ch:nth-child(3){animation-delay:.15s}\n  .nav-mark .ch:nth-child(4){animation-delay:.20s}\n  .nav-mark .ch:nth-child(5){animation-delay:.25s}\n  .nav-mark .ch:nth-child(6){animation-delay:.30s}\n  .nav-mark .dot { color: var(--accent); animation: charDrop .7s .35s both, dotPulse 2.4s 1s ease-in-out infinite; display: inline-block; }\n  @keyframes charDrop { from {opacity:0; transform: translateY(-20px); filter: blur(6px);} to {opacity:1; transform:translateY(0); filter:blur(0);} }\n  @keyframes dotPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.4); filter: drop-shadow(0 0 12px var(--accent));} }\n\n  .nav-list { display: flex; flex-direction: column; gap: 2px; }\n  .nav-link {\n    display: flex; align-items: center; gap: 12px;\n    padding: 10px 12px;\n    font-size: 12px; color: var(--fg-dim);\n    text-decoration: none;\n    border-radius: 0;\n    cursor: pointer;\n    position: relative;\n    transition: color .25s, padding-left .25s cubic-bezier(.2,.7,.2,1);\n    font-family: var(--mono); font-weight: 600;\n    letter-spacing: 0.04em; text-transform: uppercase;\n  }\n  .nav-link::before {\n    content: \"\"; position: absolute; left: 0; top: 50%;\n    width: 0; height: 1px; background: var(--accent);\n    transition: width .3s ease;\n  }\n  .nav-link:hover { color: var(--fg); padding-left: 18px; }\n  .nav-link:hover::before { width: 8px; }\n  .nav-link.active { color: var(--fg); padding-left: 18px; }\n  .nav-link.active::before { width: 12px; }\n  .nav-link .num {\n    font-size: 10px; color: var(--fg-faint); width: 20px;\n    letter-spacing: 0.1em; font-weight: 700;\n  }\n  .nav-link.active .num { color: var(--accent); }\n\n  .nav-foot { margin-top: auto; padding-top: 24px; border-top: 1px solid var(--rule); }\n  .nav-user {\n    display: flex; align-items: center; gap: 10px;\n    padding: 8px 0;\n  }\n  .nav-avatar {\n    width: 32px; height: 32px; border-radius: 50%;\n    background: linear-gradient(135deg, #2a2a28, #161614);\n    display: grid; place-items: center;\n    font-family: var(--sans); font-weight: 700; font-size: 12px;\n    border: 1px solid var(--rule-strong);\n    position: relative;\n  }\n  .nav-avatar::after {\n    content: \"\"; position: absolute; inset: -2px; border-radius: 50%;\n    border: 1px solid var(--accent); opacity: 0;\n    animation: ringPulse 2.4s ease-in-out infinite;\n  }\n  @keyframes ringPulse { 0%,100%{opacity:0; transform:scale(1);} 50%{opacity:.5; transform:scale(1.18);} }\n  .nav-user .meta { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }\n  .nav-user .meta .name { color: var(--fg); }\n  .nav-user .meta .streak { color: var(--fg-dim); margin-top: 3px; }\n  .nav-user .meta .streak b { color: var(--accent); font-weight: 400; }\n\n  /* Main */\n  main.canvas { flex: 1; min-width: 0; padding: 48px 64px 80px; }\n\n  /* Page header */\n  .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 48px; }\n  .page-eyebrow {\n    font-family: var(--mono); font-size: 11px; font-weight: 700;\n    text-transform: uppercase; letter-spacing: 0.22em;\n    color: var(--fg-dim); margin-bottom: 16px;\n  }\n  .page-eyebrow .num { color: var(--accent); margin-right: 8px; animation: numFlicker 5s ease-in-out infinite; display: inline-block; }\n  @keyframes numFlicker { 0%,93%,100%{opacity:1;} 94%{opacity:.3;} 95%{opacity:1;} 96%{opacity:.3;} 97%{opacity:1;} }\n  h1.page-title {\n    font-family: var(--sans); font-weight: 700;\n    font-size: 64px; letter-spacing: -0.035em; line-height: 1;\n  }\n  h1.page-title em { font-style: normal; color: var(--accent); font-weight: 700; }\n  .page-aside { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--fg-faint); letter-spacing: 0.18em; text-transform: uppercase; }\n\n  @keyframes reveal { from {opacity:0; transform:translateY(14px); filter:blur(4px);} to {opacity:1; transform:translateY(0); filter:blur(0);} }\n  @keyframes revealSoft { from{opacity:0;} to{opacity:1;} }\n\n  /* Page wrapper — animates on switch */\n  .page { display: none; }\n  .page.active { display: block; animation: pageEnter .6s cubic-bezier(.2,.7,.2,1); }\n  @keyframes pageEnter {\n    from { opacity: 0; transform: translateY(20px); filter: blur(6px); }\n    to   { opacity: 1; transform: translateY(0); filter: blur(0); }\n  }\n\n  /* ============ DASHBOARD ============ */\n  .dash-grid { display: grid; grid-template-columns: 1fr 360px; gap: 80px; align-items: start; }\n  .dash-section + .dash-section { margin-top: 64px; padding-top: 48px; border-top: 1px solid var(--rule); }\n\n  /* Stats row */\n  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }\n  .stat {\n    padding: 0 32px 0 0; border-right: 1px solid var(--rule);\n    opacity: 0; animation: reveal .8s cubic-bezier(.2,.7,.2,1) forwards;\n  }\n  .stat:nth-child(2) { padding-left: 32px; }\n  .stat:nth-child(3) { padding-left: 32px; border-right: none; }\n  .stat:nth-child(1){animation-delay:.1s} .stat:nth-child(2){animation-delay:.2s} .stat:nth-child(3){animation-delay:.3s}\n  .stat .lbl {\n    font-family: var(--mono); font-size: 10px; font-weight: 700;\n    text-transform: uppercase; letter-spacing: 0.2em;\n    color: var(--fg-dim); margin-bottom: 16px;\n  }\n  .stat .val {\n    font-family: var(--sans); font-weight: 700;\n    font-size: 56px;\n    line-height: .95; letter-spacing: -0.035em;\n    font-variant-numeric: tabular-nums;\n  }\n  .stat .val .unit { font-family: var(--mono); font-weight: 600; font-size: 12px; color: var(--fg-dim); margin-left: 6px; }\n  .stat .val .frac { color: var(--fg-faint); }\n  .stat .delta {\n    margin-top: 16px;\n    font-family: var(--mono); font-size: 11px; font-weight: 600;\n    color: var(--fg-dim); letter-spacing: 0.04em;\n    display: flex; align-items: center; gap: 8px;\n  }\n  .stat .delta .arrow { color: var(--accent); animation: arrow 2.4s ease-in-out infinite; display: inline-block; }\n  .stat .delta .arrow.down { color: var(--red); animation-name: arrowDn; }\n  @keyframes arrow { 0%,100%{transform:translate(0,0);} 50%{transform:translate(2px,-2px);} }\n  @keyframes arrowDn { 0%,100%{transform:translate(0,0);} 50%{transform:translate(2px,2px);} }\n  .stat .spark { margin-left: auto; height: 12px; width: 50px; color: var(--fg-faint); }\n  .stat .spark polyline { stroke-dasharray: 200; stroke-dashoffset: 200; animation: drawSpark 1.4s 1s cubic-bezier(.2,.7,.2,1) forwards; }\n  @keyframes drawSpark { to { stroke-dashoffset: 0; } }\n\n  /* Recovery list */\n  .rec-list { display: flex; flex-direction: column; }\n  .rec-row {\n    display: grid; grid-template-columns: 12px 1fr auto;\n    gap: 14px; align-items: center;\n    padding: 14px 0; border-bottom: 1px solid var(--rule);\n    opacity: 0; animation: reveal .6s cubic-bezier(.2,.7,.2,1) forwards;\n    transition: padding-left .3s ease;\n    cursor: default;\n  }\n  .rec-row:first-child { border-top: 1px solid var(--rule); }\n  .rec-row:hover { padding-left: 8px; }\n  .rec-row:nth-child(1){animation-delay:.4s}\n  .rec-row:nth-child(2){animation-delay:.5s}\n  .rec-row:nth-child(3){animation-delay:.6s}\n  .rec-row:nth-child(4){animation-delay:.7s}\n  .rec-row:nth-child(5){animation-delay:.8s}\n  .rec-row:nth-child(6){animation-delay:.9s}\n  .rec-row:nth-child(7){animation-delay:1.0s}\n  .rec-swatch {\n    width: 6px; height: 6px; border-radius: 50%;\n    box-shadow: 0 0 6px currentColor;\n    animation: swatchPulse 2.6s ease-in-out infinite;\n  }\n  @keyframes swatchPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.4);} }\n  .rec-name { font-size: 13px; font-weight: 600; text-transform: capitalize; color: var(--fg); }\n  .rec-pct {\n    font-family: var(--mono); font-size: 13px; font-weight: 700;\n    font-variant-numeric: tabular-nums;\n  }\n  .rec-bar {\n    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--rule-strong);\n  }\n  .rec-bar .lbl {\n    font-family: var(--mono); font-size: 10px; font-weight: 700;\n    text-transform: uppercase; letter-spacing: 0.2em;\n    color: var(--fg-dim); margin-bottom: 10px;\n  }\n  .rec-bar .composite {\n    font-family: var(--sans); font-weight: 700; font-size: 44px;\n    letter-spacing: -0.035em; line-height: 1;\n    font-variant-numeric: tabular-nums;\n    animation: breathe 4s ease-in-out 1.5s infinite;\n  }\n  @keyframes breathe { 0%,100%{opacity:1;} 50%{opacity:.8; text-shadow: 0 0 24px var(--accent-glow);} }\n  .rec-bar .composite .of { font-family: var(--mono); font-size: 14px; color: var(--fg-dim); margin-left: 4px; }\n\n  /* Workout list */\n  .workout-list { border-top: 1px solid var(--rule-strong); }\n  .wo {\n    display: grid; grid-template-columns: 24px 1fr auto;\n    gap: 18px; padding: 20px 0;\n    border-bottom: 1px solid var(--rule);\n    align-items: baseline;\n    opacity: 0; animation: reveal .7s cubic-bezier(.2,.7,.2,1) forwards;\n    transition: padding-left .35s cubic-bezier(.2,.7,.2,1);\n    position: relative; cursor: default;\n  }\n  .wo::after {\n    content: \"\"; position: absolute; left: 0; bottom: 0;\n    width: 0; height: 1px; background: var(--accent);\n    transition: width .5s cubic-bezier(.2,.7,.2,1);\n  }\n  .wo:hover::after { width: 100%; }\n  .wo:hover { padding-left: 10px; }\n  .wo:hover .wo-name { color: var(--accent); }\n  .wo:hover .wo-num { color: var(--accent); }\n  .wo:nth-child(1){animation-delay:.15s} .wo:nth-child(2){animation-delay:.27s} .wo:nth-child(3){animation-delay:.39s} .wo:nth-child(4){animation-delay:.51s}\n  .wo-num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--fg-faint); transition: color .3s; }\n  .wo-name { font-family: var(--sans); font-weight: 700; font-size: 22px; letter-spacing: -0.025em; line-height: 1.15; transition: color .3s; }\n  .wo-detail {\n    font-family: var(--mono); font-size: 11px; font-weight: 600;\n    color: var(--fg-dim); margin-top: 6px;\n    text-transform: uppercase; letter-spacing: 0.04em;\n    font-variant-numeric: tabular-nums;\n  }\n  .wo-detail .sep { color: var(--fg-faint); margin: 0 6px; }\n  .wo-tag { font-family: var(--mono); font-weight: 700; font-size: 10px; color: var(--accent); letter-spacing: 0.18em; text-transform: uppercase; margin-top: 8px; }\n  .wo-meta { text-align: right; }\n  .wo-meta .vol { font-family: var(--mono); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }\n  .wo-meta .date { font-family: var(--mono); font-weight: 600; font-size: 10px; color: var(--fg-faint); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }\n\n  /* Section title small */\n  .sub-title {\n    font-family: var(--sans); font-weight: 700; font-size: 26px;\n    letter-spacing: -0.03em; line-height: 1;\n    margin-bottom: 28px;\n  }\n  .sub-title em { font-style: normal; color: var(--accent); font-weight: 700; }\n\n  /* ============ AUTH ============ */\n  .auth-wrap { max-width: 400px; margin: 80px auto; }\n  .auth- 00\" x2=\"780\" y2=\"100\"><\u002Fline>\n          <line class=\"gridline\" x1=\"40\" y1=\"160\" x2=\"780\" y2=\"160\"><\u002Fline>\n          <line class=\"axis\" x1=\"40\" y1=\"200\" x2=\"780\" y2=\"200\"><\u002Fline>\n          <text x=\"20\" y=\"44\" class=\"tick-label\">90<\u002Ftext>\n          <text x=\"20\" y=\"104\" class=\"tick-label\">80<\u002Ftext>\n          <text x=\"20\" y=\"164\" class=\"tick-label\">70<\u002Ftext>\n          <text x=\"20\" y=\"204\" class=\"tick-label\">60<\u002Ftext>\n\n          <text x=\"80\" y=\"225\" class=\"tick-label\">FEB<\u002Ftext>\n          <text x=\"220\" y=\"225\" class=\"tick-label\">MAR<\u002Ftext>\n          <text x=\"380\" y=\"225\" class=\"tick-label\">APR<\u002Ftext>\n          <text x=\"540\" y=\"225\" class=\"tick-label\">EARLY MAY<\u002Ftext>\n          <text x=\"700\" y=\"225\" class=\"tick-label\">NOW<\u002Ftext>\n\n          <polyline class=\"line\" points=\"60,180 130,170 200,160 270,150 340,140 410,130 480,120 550,110 620,90 690,70 760,50\"><\u002Fpolyline>\n          <circle class=\"pt\" cx=\"60\" cy=\"180\" style=\"animation-delay:.6s\"><\u002Fcircle>\n          <circle class=\"pt\" cx=\"130\" cy=\"170\" style=\"animation-delay:.7s\"><\u002Fcircle>\n          <circle class=\"pt\" cx=\"200\" cy=\"160\" style=\"animation-delay:.8s\"><\u002Fcircle>\n          <circle class=\"pt pr\" cx=\"270\" cy=\"150\" style=\"animation-delay:.9s\"><\u002Fcircle>\n          <circle class=\"pt\" cx=\"340\" cy=\"140\" style=\"animation-delay:1.0s\"><\u002Fcircle>\n          <circle class=\"pt pr\" cx=\"410\" cy=\"130\" style=\"animation-delay:1.1s\"><\u002Fcircle>\n          <circle class=\"pt\" cx=\"480\" cy=\"120\" style=\"animation-delay:1.2s\"><\u002Fcircle>\n          <circle class=\"pt pr\" cx=\"550\" cy=\"110\" style=\"animation-delay:1.3s\"><\u002Fcircle>\n          <circle class=\"pt\" cx=\"620\" cy=\"90\" style=\"animation-delay:1.4s\"><\u002Fcircle>\n          <circle class=\"pt pr\" cx=\"690\" cy=\"70\" style=\"animation-delay:1.5s\"><\u002Fcircle>\n          <circle class=\"pt pr\" cx=\"760\" cy=\"50\" style=\"animation-delay:1.6s\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <!-- PR list -->\n      <div class=\"chart-card\" style=\"border-bottom:none;\">\n        <div class=\"chart-card-head\">\n          <div class=\"chart-card-title\">PR <em>timeline.<\u002Fem><\u002Fdiv>\n          <div class=\"chart-card-aside\">5 records this season<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"pr-list\">\n          <div class=\"pr-row\">\n            <div class=\"pr-weight\">85 kg <em>LATEST PR<\u002Fem><\u002Fdiv>\n            <div class=\"pr-sets\">5 × 1<\u002Fdiv>\n            <div class=\"pr-date\">03 May<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pr-row\">\n            <div class=\"pr-weight\">82.5 kg<\u002Fdiv>\n            <div class=\"pr-sets\">5 × 3<\u002Fdiv>\n            <div class=\"pr-date\">19 Apr<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pr-row\">\n            <div class=\"pr-weight\">80 kg<\u002Fdiv>\n            <div class=\"pr-sets\">5 × 5<\u002Fdiv>\n            <div class=\"pr-date\">02 Apr<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"pr-row\">\n            <div class=\"pr-weight\">77.5 kg<\u002Fdiv>\n            <div class=\"pr-sets\">5 × 5<\u002Fdiv>\n            <div class=\"pr-date\">15 Mar<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- AUTH -->\n    <section class=\"page\" data-page=\"auth\">\n      <div class=\"auth-wrap\">\n        <div class=\"auth-mark\">ASCEND<span class=\"dot\">.<\u002Fspan><\u002Fdiv>\n        <div class=\"auth-deck\">Your AI-powered training coach.<\u002Fdiv>\n\n        <div class=\"auth-tabs\">\n          <button class=\"auth-tab active\" data-auth=\"login\">Sign In<\u002Fbutton>\n          <button class=\"auth-tab\" data-auth=\"signup\">Create Account<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div class=\"field\">\n          <label>Email<\u002Flabel>\n          <input type=\"email\" placeholder=\"you@somewhere.com\">\n        <\u002Fdiv>\n        <div class=\"field\">\n          <label>Password<\u002Flabel>\n          <input type=\"password\" placeholder=\"••••••••\">\n        <\u002Fdiv>\n\n        <button class=\"btn\">Continue<\u002Fbutton>\n        <button class=\"btn ghost\" style=\"margin-top:12px;\">Forgot password<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fmain>\n<\u002Fdiv>\n\n<script>\n  // Cursor glow\n  const glow = document.getElementById('cursorGlow');\n  let mx=0,my=0,gx=0,gy=0;\n  document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });\n  function loop(){ gx+=(mx-gx)*0.08; gy+=(my-gy)*0.08; glow.style.left=gx+'px'; glow.style.top=gy+'px'; requestAnimationFrame(loop); } loop();\n\n  // Page nav\n  function showPage(name){\n    document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('active', n.dataset.page===name));\n    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.dataset.page===name));\n    runCounters();\n    fillBars();\n  }\n  document.querySelectorAll('.nav-link').forEach(n => n.addEventListener('click', () => showPage(n.dataset.page)));\n\n  // Counters\n  function runCounters(){\n    document.querySelectorAll('[data-count]').forEach(el => {\n      const target = parseFloat(el.dataset.count);\n      const fmt = el.dataset.format;\n      const start = performance.now();\n      const dur = 1400;\n      function frame(now){\n        const t = Math.min((now-start)/dur, 1);\n        const e = 1 - Math.pow(1-t, 3);\n        const v = target * e;\n        el.textContent = fmt === 'int' ? Math.round(v) : Math.round(v).toLocaleString('en-US');\n        if (t<1) requestAnimationFrame(frame);\n      }\n      requestAnimationFrame(frame);\n    });\n  }\n  function fillBars(){\n    setTimeout(() => {\n      document.querySelectorAll('.ch-fill').forEach(f => { f.style.width = f.dataset.w + '%'; });\n    }, 400);\n  }\n\n  // Tabs (logger, auth)\n  document.querySelectorAll('.log-tab').forEach(t => t.addEventListener('click', () => {\n    document.querySelectorAll('.log-tab').forEach(x => x.classList.toggle('active', x===t));\n    document.querySelectorAll('.log-panel').forEach(p => p.style.display = p.dataset.tab===t.dataset.tab ? 'block' : 'none');\n  }));\n  document.querySelectorAll('.auth-tab').forEach(t => t.addEventListener('click', () => {\n    document.querySelectorAll('.auth-tab').forEach(x => x.classList.toggle('active', x===t));\n  }));\n  document.querySelectorAll('.ex-tab').forEach(t => t.addEventListener('click', () => {\n    document.querySelectorAll('.ex-tab').forEach(x => x.classList.toggle('active', x===t));\n  }));\n  document.querySelectorAll('.mg-chip').forEach(c => c.addEventListener('click', () => {\n    document.querySelectorAll('.mg-chip').forEach(x => x.classList.toggle('active', x===c));\n  }));\n\n  // Magnetic avatars\n  document.querySelectorAll('.av').forEach(av => {\n    av.addEventListener('mousemove', e => {\n      const r = av.getBoundingClientRect();\n      const x = (e.clientX - r.left - r.width/2)*0.3;\n      const y = (e.clientY - r.top - r.height/2)*0.3 - 3;\n      av.style.transform = `translate(${x}px,${y}px) scale(1.15)`;\n    });\n    av.addEventListener('mouseleave', () => av.style.transform = '');\n  });\n\n  window.addEventListener('DOMContentLoaded', () => {\n    setTimeout(runCounters, 400);\n    fillBars();\n  });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
